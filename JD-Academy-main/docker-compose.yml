version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: jdm-academy-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: jdmacad
      MYSQL_USER: jdmuser
      MYSQL_PASSWORD: jdmacademy_dev_pass
    ports:
      - "3306:3306"
    volumes:
      - ./Backend/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql
      - ./node-app/migrations/001_page_visits.sql:/docker-entrypoint-initdb.d/20-page-visits.sql
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

volumes:
  mysql_data:
